# Checkov configuration
# https://www.checkov.io/2.Basics/CLI%20Command%20Reference.html

# Frameworks to scan
framework:
  - cloudformation

# Directories to skip
skip-path:
  - node_modules
  - cdk.out
  - frontend/node_modules
  - frontend/dist
  - __pycache__
  - .git
  - security-reports
  - samples
  - mcs-custom-module

# Output format
output: cli

# Compact output
compact: true

# Soft fail (don't exit with error code)
soft-fail: false

# Documented suppressions with justifications
# These are intentional design decisions or CDK framework limitations
skip-check:
  # Lambda checks - CDK custom resources and framework-generated functions
  # These are short-lived deployment-time functions, not application code
  - CKV_AWS_115  # Lambda concurrent execution - CDK framework functions (CustomS3AutoDeleteObjects, BucketDeployment, Provider framework) cannot be configured
  - CKV_AWS_116  # Lambda DLQ - CDK custom resources handle errors via CloudFormation
  - CKV_AWS_117  # Lambda in VPC - CDK custom resources need internet access for AWS APIs
  
  # IAM policy checks - These are intentional for workstation management functionality
  # ImageBuilder and Step Functions need broad EC2/CloudFormation permissions
  - CKV_AWS_108  # Data exfiltration - Step Functions needs CloudFormation describe
  - CKV_AWS_109  # Permissions management - ImageBuilder needs iam:PassRole for EC2
  - CKV_AWS_110  # Privilege escalation - ImageBuilder needs iam:PassRole
  
  # CKV_AWS_111 - IAM write without constraints
  # These policies need broad permissions for workstation management:
  # - EC2 RunInstances/TerminateInstances for dynamic workstation creation
  # - SSM SendCommand for DCV installation on any workstation
  # - Step Functions for workflow orchestration
  # Resource constraints are applied where possible (account/region scoped)
  - CKV_AWS_111

# FIXED in code (no longer suppressed):
# - CKV_AWS_119: DynamoDB KMS encryption - using customer-managed KMS
# - CKV_AWS_149: Secrets Manager KMS encryption - using customer-managed KMS
# - CKV_AWS_18/21: S3 logging/versioning - enabled on application buckets
# - CKV_AWS_26: SNS encryption - using KMS
# - CKV_AWS_79: EC2 IMDSv2 - enabled on all launch templates
# - CKV_AWS_91: NLB access logging - enabled on both NLBs
# - CKV_AWS_28: DynamoDB PITR - enabled on all tables
# - CKV_AWS_363: Deprecated runtime - all Lambdas updated to nodejs22.x/python3.12
# - CKV_AWS_173: Lambda environment encryption - using customer-managed KMS
# - CKV_AWS_115: Lambda concurrent execution - added to all 48 application Lambda functions

# Known limitations (cannot be fixed):
# - CKV_AWS_18 on LogsBucket/NlbAccessLogsBucket/ImageBuilderLogsBucket:
#   These are access log destination buckets - they cannot log to themselves.
#   This is an AWS limitation, not a security gap.

# Intentional design decisions (not security issues):
# - CKV_AWS_59 on auth/ldap and auth/validate endpoints:
#   These endpoints intentionally allow unauthenticated access for login flow.
#   They validate credentials and return JWT tokens.
