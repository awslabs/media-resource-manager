# yaml-language-server: $schema=https://raw.githubusercontent.com/awslabs/automated-security-helper/refs/heads/main/automated_security_helper/schemas/AshConfig.json
project_name: media-resource-manager

global_settings:
  severity_threshold: MEDIUM

  # Exclude CDK synthesized output directories from scanning.
  # These contain base64-encoded Lambda code that triggers thousands of false positive
  # "high entropy string" detections from detect-secrets. CDK-nag runs separately
  # via `npm run nag` against the synthesized templates.
  ignore_paths:
    - path: 'cdk.out'
      reason: 'CDK synthesized CloudFormation templates — scanned separately via cdk-nag'
    - path: 'cdk.out.scan'
      reason: 'CDK synthesized templates (scan copy) — scanned separately via cdk-nag'
    - path: 'cdk.out.deploy'
      reason: 'CDK deployment output — not source code'
    - path: 'cdk.out.list'
      reason: 'CDK list output — not source code'
    - path: 'node_modules'
      reason: 'Third-party dependencies — scanned via grype/npm-audit SCA'
    - path: 'frontend/node_modules'
      reason: 'Frontend third-party dependencies'
    - path: 'frontend/dist'
      reason: 'Frontend build output — not source code'
    - path: 'frontend/public/dcvsdk'
      reason: 'Amazon DCV Web Client SDK, fetched and GPG-verified at build time by scripts/fetch-dcv-web-sdk.sh — third-party, not source code'
    - path: 'frontend/public/connect'
      reason: 'License files copied from the Amazon DCV Web Client SDK at build time'
    - path: '.ash'
      reason: 'ASH scan output directory'
    - path: '.gitleaks.toml'
      reason: 'gitleaks allowlist config — contains regex patterns that intentionally match false-positive strings (e.g. PrivateSubnet1Id JMESPath, Microsoft KMS GVLK). Not actual secrets.'

  # Suppressions for verified false positives from detect-secrets.
  # These are Secrets Manager ARN references, env var name mappings, and
  # AWS log group paths — not actual secret values.
  suppressions:
    # Secrets Manager ARN reference (not a secret value, just a pointer to where secrets are stored)
    - rule_id: 'SECRET-SECRET-KEYWORD'
      path: 'lambda/generate-regional-hub-template/index.js'
      line_start: 3992
      line_end: 3992
      reason: 'SecretArn property with value "none" — CloudFormation response placeholder when no secret exists'

    # Base64 hash used as CDK CustomResource cache key (deterministic, not a secret)
    - rule_id: 'SECRET-BASE64-HIGH-ENTROPY-STRING'
      path: 'lib/constructs/agentcore-runtime.ts'
      reason: 'MD5 hex hash of config inputs used as CDK CustomResource physical ID — deterministic, not a secret'

    # Documentation example showing a file path parameter (not a key value)
    - rule_id: 'SECRET-SECRET-KEYWORD'
      path: 'docs/CUSTOM_DOMAIN_SETUP.md'
      reason: 'Documentation example showing DcvPrivateKeyFile parameter — value is a file path, not a key'

    # Deploy pipeline env var name mappings (variable names contain "Secret", values are parameter key names)
    - rule_id: 'SECRET-SECRET-KEYWORD'
      path: 'scripts/deploy-pipeline.yaml'
      reason: 'Environment variable and parameter name mappings containing "Secret" in the key name — no actual secret values present'

    # Linux phase 1 embeds the AWS CLI Team public key and pins its fingerprint to
    # verify the AWS CLI installer (#78). Scoped to the file and each rule the
    # public values trigger, not to lines, so edits to the script keep it valid.
    - rule_id: 'SECRET-BASE64-HIGH-ENTROPY-STRING'
      path: 'ssm-documents/linux-phase1-base-install.js'
      reason: 'Public AWS CLI signing key from the AWS CLI install guide (PGP public key block) — not a secret'
    - rule_id: 'SECRET-HEX-HIGH-ENTROPY-STRING'
      path: 'ssm-documents/linux-phase1-base-install.js'
      reason: 'Fingerprint of the public AWS CLI signing key from the AWS CLI install guide — not a secret'
    - rule_id: 'SECRET-AWS-ACCESS-KEY'
      path: 'ssm-documents/linux-phase1-base-install.js'
      reason: 'Fingerprint of the public AWS CLI signing key (AWS_CLI_KEY_FPR) matches the access key pattern — not a credential'
    - rule_id: 'generic-api-key'
      path: 'ssm-documents/linux-phase1-base-install.js'
      reason: 'Fingerprint of the public AWS CLI signing key (AWS_CLI_KEY_FPR) matches the generic API key pattern — not a secret'

    # The DCV session manager wait test fakes the broker and SSM with
    # placeholder values. Scoped to the test file and rule, not to lines.
    - rule_id: 'B105'
      path: 'test/python/test_dcv_session_manager_session_wait.py'
      reason: 'Placeholder access token string returned by the fake broker OAuth endpoint in a unit test stub — not a credential'
    - rule_id: 'SECRET-SECRET-KEYWORD'
      path: 'test/python/test_dcv_session_manager_session_wait.py'
      reason: 'Placeholder client password returned by the fake SSM GetParameter in a unit test stub — not a credential'

    # scripts/fetch-dcv-web-sdk.sh pins the fingerprint of the public NICE GPG
    # key and the SHA-256 of the Amazon DCV Web Client SDK archive it verifies.
    - rule_id: 'generic-api-key'
      path: 'scripts/fetch-dcv-web-sdk.sh'
      reason: 'Fingerprint of the public NICE GPG signing key (NICE_KEY_FINGERPRINT) matches the generic API key pattern — not a secret'
    - rule_id: 'SECRET-HEX-HIGH-ENTROPY-STRING'
      path: 'scripts/fetch-dcv-web-sdk.sh'
      reason: 'Public NICE GPG key fingerprint and the published SHA-256 of the Amazon DCV Web Client SDK archive — not secrets'

# Documented semgrep/opengrep rule exclusions. Reasons are in
# docs/SECURITY_SCANNING.md; keep the two lists and that document in step.
scanners:
  semgrep:
    options:
      exclude_rule:
        - 'typescript.react.portability.i18next.jsx-not-internationalized.jsx-not-internationalized'
        - 'gitlab.nodejs_scan.javascript-ssrf-rule-node_ssrf'
        - 'python.lang.best-practice.sleep.arbitrary-sleep'
  opengrep:
    options:
      exclude_rule:
        - 'typescript.react.portability.i18next.jsx-not-internationalized.jsx-not-internationalized'
        - 'gitlab.nodejs_scan.javascript-ssrf-rule-node_ssrf'
        - 'python.lang.best-practice.sleep.arbitrary-sleep'
