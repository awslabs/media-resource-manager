<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="app-title">AWS Media Resource Manager</title>
    <script>
      // Apply dark mode background immediately to prevent white flash
      (function() {
        try {
          var darkMode = JSON.parse(localStorage.getItem('darkMode'));
          if (darkMode) {
            document.documentElement.style.backgroundColor = '#060a0f';
            document.body.style.backgroundColor = '#060a0f';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
